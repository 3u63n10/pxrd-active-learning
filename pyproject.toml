[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pxrd-active-learning"
version = "0.1.0"
description = "Sequential design methods for PXRD-guided phase mapping"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "3u63n10" }
]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "scikit-learn>=1.4"
]

[project.optional-dependencies]
monitor = [
  "pyserial>=3.5"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pxrd_monitor = ["static/*.html"]
